body {

#home {
    padding: 120px 20px;
    background: linear-gradient(135deg, #14213d, #1e3a8a);
}

#home h1 {
    font-size: 42px;
}

#home p {
    color: #cbd5e1;
}

#home a {
    display: inline-block;
    background: #0ea5e9;
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
    text-decoration: none;
}

.cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 12px;
    min-width: 140px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 8px 25px rgba(14,165,233,0.3);
}

footer {
    text-align: center;
    padding: 20px;
    background: #111827;
}

@media(max-width: 600px) {
    header {
        flex-direction: column;
    }

    nav a {
        display: inline-block;
        margin: 6px;
    }

    #home h1 {
        font-size: 30px;
    }
